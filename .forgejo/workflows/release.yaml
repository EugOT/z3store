name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (informational only; the workflow does not push or publish)."
        required: false
        type: string
      fuzz_budget_seconds:
        description: "Deep-fuzz wall-clock budget for verify-release."
        required: false
        default: "7200"
        type: string
      issue:
        description: "Linear issue (TEO-n) whose readiness record authorizes this release."
        required: true
        type: string

jobs:
  verify-release:
    name: Tier 4 release verification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FUZZ_BUDGET_SECONDS: ${{ inputs.fuzz_budget_seconds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install Zig 0.16.0 via mise
        run: mise install zig@0.16.0

      - name: Verify Zig toolchain resolves
        run: mise x zig@0.16.0 -- zig version

      - name: Bun install
        run: bun ci

      - name: Run verify-release gate (readiness --require-evidence first, then tier 4)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          Z3_READINESS_ISSUE: ${{ inputs.issue }}
        run: bun scripts/verify-release.ts

      - name: Record release-verification evidence on the Linear issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: mise x aqua:nushell/nushell@0.109.1 -- nu --no-config-file .readiness/readiness.nu evidence --issue "$ISSUE" --kind release-verification --control-point forgejo:release --run "$RUN_URL" --note "verify-release tier: reproducible rebuild, deep fuzz, SBOM"
