name: verify-pr

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: verify-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig-gate:
    name: Zig quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install Zig 0.16.0 via mise
        run: mise install zig@0.16.0

      - name: Verify Zig toolchain resolves
        run: mise x zig@0.16.0 -- zig version

      - name: Bun install
        run: bun ci

      - name: Run verify-pr gate (readiness check first, then tiers 2-3)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bun scripts/verify-pr.ts

      - name: Record source-validation evidence on the Linear issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue="$(mise x aqua:nushell/nushell@0.109.1 -- nu --no-config-file .readiness/readiness.nu issue)"
          mise x aqua:nushell/nushell@0.109.1 -- nu --no-config-file .readiness/readiness.nu evidence --issue "$issue" --kind source-validation --control-point forgejo:verify-pr --ref "$HEAD_SHA" --run "$RUN_URL" --note "verify-pr tier: cross-target matrix, safety modes, docs, bounded fuzz"

  evals:
    name: Eval structural check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: zig-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Bun install
        run: bun ci

      - name: Run eval structural check
        run: bun scripts/eval.ts --check

  coverage:
    name: kcov line coverage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: zig-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install Zig 0.16.0 via mise
        run: mise install zig@0.16.0

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Bun install
        run: bun ci

      - name: Measure coverage
        run: bun scripts/kcov-coverage.ts --print

      - name: Enforce coverage threshold
        run: bun scripts/check-coverage.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
